# Interior camera validation config (Step 1 - GATING)
# Render-only test: load PLY and render from interior cameras
# NO SDS, NO training, NO prompt processor

name: "interior-camera-test"
tag: "render-only"
exp_root_dir: "outputs"
seed: 0

# Use our custom interior camera data module
data_type: "interior-camera-datamodule"
data:
  # Fixed camera position inside the room (world coordinates, meters)
  # NOTE: PLY is Y-up (from GLB), so camera height is along Y axis
  camera_position: [0.0, 1.6, 0.0]

  # No jitter for strictly single-position view
  position_jitter: 0.0

  # Full horizontal coverage
  azimuth_range: [-180, 180]

  # Elevation range covering floor and ceiling views
  elevation_range: [-60, 60]

  # Standard FOV for interior views
  fovy_range: [40, 70]

  # No camera perturbation for clean validation
  camera_perturb: 0.0
  center_perturb: 0.0
  up_perturb: 0.0

  batch_size: 1
  width: 512
  height: 512

  # Light settings (not used for render-only, but required)
  light_sample_strategy: "dreamfusion"
  light_distance_range: [5.0, 10.0]
  light_position_perturb: 1.0

  # Evaluation views: 12 test views (4 azimuths x 3 elevations)
  n_val_views: 1
  n_test_views: 12

  # Eval settings (used by InteriorCameraDataset)
  eval_camera_position: [0.0, 1.6, 0.0]
  eval_fovy_deg: 70.0

  rays_d_normalize: false

system_type: "gaussian-splatting-system"
system:
  geometry_type: "gaussian-splatting"
  geometry:
    # PATH MUST BE SET VIA CLI:
    # geometry_convert_from="/path/to/points3D.ply"
    geometry_convert_from: ""
    load_ply_only_vertex: true

    # Learning rates (not used for render-only, but required)
    position_lr: [0, 0.001, 0.00002, 1000]
    scale_lr: 0.005
    feature_lr: 0.01
    opacity_lr: 0.05
    rotation_lr: 0.005

    # Densification disabled for render-only test
    densification_interval: 100000
    prune_interval: 100000
    opacity_reset_interval: 100000
    densify_from_iter: 100000
    densify_until_iter: 100000
    prune_from_iter: 100000
    prune_until_iter: 100000
    densify_grad_threshold: 0.01
    min_opac_prune: 0.005
    split_thresh: 0.02
    radii2d_thresh: 1000

    init_num_pts: 4096
    pc_init_radius: 0.8
    opacity_init: 0.2

  renderer_type: "diff-gaussian-rasterizer"
  renderer:
    debug: false
    invert_bg_prob: 1.0  # White background for easier inspection

  material_type: "no-material"
  material:
    n_output_dims: 0

  background_type: "solid-color-background"

  # Prompt processor not used for render-only test
  prompt_processor_type: "dummy-prompt-processor"
  prompt_processor:
    pretrained_model_name_or_path: ""
    prompt: ""

  # No guidance for render-only test
  guidance_type: "dummy-guidance"
  guidance:
    pretrained_model_name_or_path: ""

  exporter_type: "gaussian-mesh-exporter"

  loggers:
    wandb:
      enable: false

  loss:
    lambda_sds: 0.0
    lambda_position: 0.0
    lambda_opacity: 0.0
    lambda_scales: 0.0
    lambda_tv_loss: 0.0

trainer:
  max_steps: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 1
  enable_progress_bar: false
  precision: 32

checkpoint:
  save_last: false
  save_top_k: 0
  every_n_train_steps: 100000
